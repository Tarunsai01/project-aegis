services:
  - type: web
    name: project-aegis
    runtime: python
    buildCommand: pip install -r "Project - AEGIS/requirements.txt" && python -m spacy download en_core_web_sm
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    rootDirectory: Project - AEGIS
    envVars:
      - key: GROQ_API_KEY
        sync: false
